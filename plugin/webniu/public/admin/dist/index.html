<!doctype html>
<html>
  <head>
    <title>Webniu 网牛引擎</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Webniu 网牛引擎 webniu.com" />
    <meta
      name="description"
      content="Webniu 网牛引擎是一个基于 webman + vue3 + element-plus + TypeScript, and art-design-pro 的后台管理系统."
    />
    <link rel="shortcut icon" type="image/x-icon" href="/app/webniu/admin/dist/assets/ico/favicon.ico" />
    <style>
      /* 防止页面刷新时白屏的初始样式 */
      html {
        background-color: #fafbfc;
      }
      html.dark {
        background-color: #070707;
      }
    </style>
    <script>
      var __Config__ // 站点基础配置
      var __Info__ // 用户信息
      var __Login__ // 登录入口
      var __APP_VERSION__ // 版本号
      var __WORKTAB__ // 工作台
      // 可用在控制器中创建自己的入口变量
      __Config__ = '{{ $confit_url }}'
      __WORKTAB__ = '{{ $worktab }}'
      __Login__ = '{{ $login_url }}'
      __Info__ = '{{ $info_url }}'

      /**
       * 多应用模式检测（仅开发环境生效）
       * 开发时 PHP 不渲染本文件，上方双花括号占位符保持字面量；
       * 生产环境 public_view 会把占位符替换为真实值（不含 {{ ），本脚本自动跳过，
       * 行为与 PHP 注入完全一致。
       */
      ;(function () {
        // 生产环境已由 PHP 注入真实配置，直接跳过
        if (typeof __Config__ !== 'string' || __Config__.indexOf('\{\{') === -1) return

        // 应用预设表：新增平台在这里加一项即可
        var APP_PRESETS = {
          webniu: { 
            config: '/webniu/admin/config', 
            worktab: 'webniu',
            login: '/webniu/admin/account/login',
            info: '/webniu/admin/account/info',
          },
          wechat: { 
            config: '/wechat/account/config', 
            worktab: 'wechat',
            login: '/webniu/admin/account/login',
            info: '/webniu/admin/account/info',
          },
          wniot: { 
            config: '/wniot/mobile/config', 
            worktab: 'wniot',
            login: '/wniot/mobile/login',
            info: '/wniot/mobile/info',
          }
        }
        var DEFAULT_APP = 'webniu'

        function getAppFromPath() {
          var m = location.pathname.match(/^\/app\/([^/]+)/i)
          return m ? m[1].toLowerCase() : ''
        }

        // 解析生效应用：?app= 显式覆盖 > 路径前缀 > 默认
        // （不再读 localStorage 记忆，保证默认始终为 webniu，避免旧选择残留）
        var params = new URLSearchParams(location.search)
        var app = params.get('app') || getAppFromPath() || DEFAULT_APP
        var preset = APP_PRESETS[app] || APP_PRESETS[DEFAULT_APP]

        // 写入全局配置
        __Config__ = preset.config
        __WORKTAB__ = preset.worktab
        __Login__ = preset.login || ''
        __Info__ = preset.info || ''

        console.info('[dev] app=' + app + ' config=' + __Config__ + ' worktab=' + __WORKTAB__)
      })()
    </script>
    <script>
      // 初始化 html class 主题属性
      ;(function () {
        try {
          if (typeof Storage === 'undefined' || !window.localStorage) {
            return
          }
          const themeType = localStorage.getItem('sys-theme')
          if (themeType === 'dark') {
            document.documentElement.classList.add('dark')
          }
        } catch (e) {
          console.warn('Failed to apply initial theme:', e)
        }
      })()
    </script>
    <script type="module" crossorigin src="/app/webniu/admin/dist/assets/js/index-C_6owoze.js"></script>
    <link rel="stylesheet" crossorigin href="/app/webniu/admin/dist/assets/css/index-wlhz9ZFw.css">
  </head>

  <body>
    <div id="app"></div>
  </body>
</html>
