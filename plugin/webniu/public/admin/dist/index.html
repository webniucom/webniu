<!doctype html>
<html>
  <head>
    <title>Webniu 网牛引擎</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Webniu 网牛引擎 webniu.com" />
    <meta
      name="description"
      content="Webniu 网牛引擎是一个基于 webman + vue3 + element-plus + TypeScript, and art-design-pro 的后台管理系统."
    />
    <link rel="shortcut icon" type="image/x-icon" href="/app/webniu/admin/dist/assets/ico/favicon.ico" />
    <style>
      /* 防止页面刷新时白屏的初始样式 */
      html {
        background-color: #fafbfc;
      }
      html.dark {
        background-color: #070707;
      }
    </style>
    <script>
      var __Config__ // 站点基础配置
      var __Info__ // 用户信息
      var __Login__ // 登录入口
      var __APP_VERSION__ // 版本号
      var __WORKTAB__ // 工作台
      var __DIRNAME__ // 应用目录
      // 可用在控制器中创建自己的入口变量
      __WORKTAB__ = '{{ $worktab }}'
      __Config__ = '{{ $confit_url }}'
      __Login__ = '{{ $login_url }}'
      __Info__ = '{{ $info_url }}'
    </script>
    <script>
      // 初始化 html class 主题属性
      ;(function () {
        try {
          if (typeof Storage === 'undefined' || !window.localStorage) {
            return
          }
          const themeType = localStorage.getItem('sys-theme')
          if (themeType === 'dark') {
            document.documentElement.classList.add('dark')
          }
        } catch (e) {
          console.warn('Failed to apply initial theme:', e)
        }
      })()
    </script>
    <script type="module" crossorigin src="/app/webniu/admin/dist/assets/js/index-BsBjD-H4.js"></script>
    <link rel="stylesheet" crossorigin href="/app/webniu/admin/dist/assets/css/index-Ds1ojN44.css">
  </head>

  <body>
    <div id="app"></div>

  </body>
</html>
