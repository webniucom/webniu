<!doctype html>
<html>
  <head>
    <title>Webniu 网牛引擎</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Webniu 网牛引擎 webniu.com" />
    <meta
      name="description"
      content="Webniu 网牛引擎是一个基于 webman + vue3 + element-plus + TypeScript, and art-design-pro 的后台管理系统."
    />
    <link rel="shortcut icon" type="image/x-icon" href="/app/webniu/admin/dist/assets/favicon-BBiPxQ9z.ico" />
    <style>
      /* 防止页面刷新时白屏的初始样式 */
      html {
        background-color: #fafbfc;
      }
      html.dark {
        background-color: #070707;
      }
      /* 启动画面：JS 下载/执行期间先展示，app 挂载后自动被替换 */
      #app-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        z-index: 9999;
        background-color: #fafbfc;
      }
      html.dark #app-splash {
        background-color: #070707;
      }
      #app-splash .splash-spinner {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        border: 3px solid rgba(64, 158, 255, 0.2);
        border-top-color: #409eff;
        animation: splash-spin 0.9s linear infinite;
      }
      #app-splash .splash-text {
        font-size: 13px;
        letter-spacing: 2px;
        color: #909399;
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      }
      @keyframes splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <script>
      var __Config__ // 站点基础配置
      var __Info__ // 用户信息
      var __Login__ // 登录入口
      var __APP_VERSION__ // 版本号
      var __WORKTAB__ // 工作台
      var __DIRNAME__ // 应用目录
      // 可用在控制器中创建自己的入口变量
      __WORKTAB__ = '{{ $worktab }}'
      __Config__ = '{{ $confit_url }}'
      __Login__ = '{{ $login_url }}'
      __Info__ = '{{ $info_url }}'
    </script>
    <script>
      // 初始化 html class 主题属性
      ;(function () {
        try {
          if (typeof Storage === 'undefined' || !window.localStorage) {
            return
          }
          const themeType = localStorage.getItem('sys-theme')
          if (themeType === 'dark') {
            document.documentElement.classList.add('dark')
          }
        } catch (e) {
          console.warn('Failed to apply initial theme:', e)
        }
      })()
    </script>
    <script type="module" crossorigin src="/app/webniu/admin/dist/assets/index-BcrUxInY.js"></script>
    <link rel="modulepreload" crossorigin href="/app/webniu/admin/dist/assets/vendor-core-DOagWpao.js">
    <link rel="modulepreload" crossorigin href="/app/webniu/admin/dist/assets/vendor-el-icons-BEiUokyW.js">
    <link rel="modulepreload" crossorigin href="/app/webniu/admin/dist/assets/vendor-element-plus-DdXciOTI.js">
    <link rel="modulepreload" crossorigin href="/app/webniu/admin/dist/assets/vendor-iconify-1u3enyk7.js">
    <link rel="stylesheet" crossorigin href="/app/webniu/admin/dist/assets/vendor-core-BgDCIyLK.css">
    <link rel="stylesheet" crossorigin href="/app/webniu/admin/dist/assets/vendor-element-plus-BhDZDkeU.css">
    <link rel="stylesheet" crossorigin href="/app/webniu/admin/dist/assets/index-C4k2ZK6o.css">
  </head>

  <body>
    <div id="app">
      <!-- 启动画面：Vue 挂载时会替换 #app 内容，此画面自动消失 -->
      <div id="app-splash">
        <div class="splash-spinner"></div>
        <div class="splash-text">加载中...</div>
      </div>
    </div>
  </body>
</html>
